databases:
  - name: skillbuddy-db
    plan: basic-256mb
    databaseName: skillbuddy
    user: skillbuddy

services:
  - type: web
    name: skillbuddy
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: ./scripts/start.sh
    healthCheckPath: /health/
    disk:
      name: skillbuddy-media
      mountPath: /opt/render/project/src/media
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skillbuddy-db
          property: connectionString
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SERVE_MEDIA_FILES
        value: "True"
