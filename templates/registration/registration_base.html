{% extends 'base.html' %}

{% block sidebar %}{% endblock %}

{% block header %}
<style>
    body {
        background: radial-gradient(circle at top right, var(--primary-light), transparent),
                    radial-gradient(circle at bottom left, var(--accent-light), transparent);
        background-color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #main-wrapper {
        margin-left: 0 !important;
        padding-left: 0 !important;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .auth-container {
        width: 100%;
        max-width: 450px;
        padding: 2rem;
    }
</style>
{% endblock %}

{% block maincontent %}
  <div class="auth-container">
    {% block content %}{% endblock content %}
  </div>
{% endblock %}
